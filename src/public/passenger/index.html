<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1" />
  <title>PayTaksi Passenger</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    html, body { margin:0; padding:0; height:100%; background:#f5f5f5; }
    #map {
      position: fixed;
      top: 0; left: 0;
      width: 100%;
      height: 100vh;
      z-index: 1;
    }

    .topBtns {
      position: fixed;
      top: 18px;
      left: 18px;
      right: 18px;
      display: flex;
      justify-content: space-between;
      gap: 12px;
      z-index: 2000;
      pointer-events: none;
    }
    .btnCircle{
      width: 52px; height: 52px;
      border-radius: 999px;
      background: #fff;
      box-shadow: 0 8px 20px rgba(0,0,0,.12);
      display:flex; align-items:center; justify-content:center;
      pointer-events: all;
      border: 0;
      font-size: 22px;
    }

    .panel {
      position: fixed;
      left: 0; right: 0; bottom: 0;
      background: #fff;
      border-radius: 22px 22px 0 0;
      padding: 18px 18px 18px 18px;
      z-index: 3000;
      box-shadow: 0 -10px 25px rgba(0,0,0,.12);
    }
    .grab {
      width: 48px;
      height: 5px;
      background: #ddd;
      border-radius: 99px;
      margin: 0 auto 12px;
    }
    h2 { margin: 0 0 12px 0; font-size: 34px; letter-spacing: -0.6px; }

    .input {
      width: 100%;
      box-sizing: border-box;
      padding: 14px 14px;
      border-radius: 12px;
      border: 1px solid #e5e5e5;
      font-size: 16px;
      outline: none;
    }

    .hintRow {
      display:flex;
      justify-content: space-between;
      gap: 12px;
      margin-top: 10px;
      font-size: 13px;
      color: #666;
    }
    .price {
      font-weight: 700;
      color: #111;
    }

    .btnPrimary {
      width: 100%;
      margin-top: 14px;
      padding: 16px 14px;
      border: 0;
      border-radius: 14px;
      background: #111;
      color: #fff;
      font-size: 16px;
      cursor: pointer;
    }
    .btnPrimary:disabled{
      opacity: .55;
      cursor: not-allowed;
    }

    .toast {
      position: fixed;
      left: 14px;
      right: 14px;
      bottom: 190px;
      background: rgba(0,0,0,.72);
      color:#fff;
      padding: 10px 12px;
      border-radius: 12px;
      font-size: 13px;
      z-index: 4000;
      display:none;
    }

    /* Simple autocomplete list */
    .acBox {
      position: relative;
      z-index: 5000;
    }
    .acList {
      position: absolute;
      left: 0; right: 0;
      top: calc(100% + 8px);
      background: #fff;
      border: 1px solid #eee;
      border-radius: 12px;
      box-shadow: 0 10px 22px rgba(0,0,0,.12);
      overflow: hidden;
      display: none;
      max-height: 230px;
      overflow-y: auto;
    }
    .acItem {
      padding: 12px 12px;
      border-bottom: 1px solid #f3f3f3;
      cursor: pointer;
      font-size: 14px;
      color: #111;
    }
    .acItem:last-child { border-bottom: 0; }
    .acItem:hover { background: #f7f7f7; }
  </style>
</head>

<body>
  <div id="map"></div>

  <div class="topBtns">
    <button class="btnCircle" id="menuBtn">☰</button>
    <button class="btnCircle" id="locBtn" title="Mənim yerim">◎</button>
  </div>

  <div class="toast" id="toast"></div>

  <div class="panel">
    <div class="grab"></div>
    <h2>Haraya?</h2>

    <div class="acBox">
      <input id="destination" class="input" type="text" placeholder="Təyinat yeri (məs: Əhmədli)" autocomplete="off" />
      <div id="acList" class="acList"></div>
    </div>

    <div class="hintRow">
      <div id="gpsStatus">GPS oxunur...</div>
      <div class="price" id="fareText">—</div>
    </div>

    <button class="btnPrimary" id="orderBtn" disabled>Sifariş et</button>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    // =============================
    // Helpers
    // =============================
    const toastEl = document.getElementById("toast");
    function toast(msg, ms=2400){
      toastEl.textContent = msg;
      toastEl.style.display = "block";
      clearTimeout(toastEl._t);
      toastEl._t = setTimeout(()=>toastEl.style.display="none", ms);
    }

    function haversineKm(lat1, lon1, lat2, lon2) {
      const R = 6371;
      const toRad = (v) => v * Math.PI / 180;
      const dLat = toRad(lat2 - lat1);
      const dLon = toRad(lon2 - lon1);
      const a =
        Math.sin(dLat/2) * Math.sin(dLat/2) +
        Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) *
        Math.sin(dLon/2) * Math.sin(dLon/2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
      return R * c;
    }

    // Tarif: 0–3km = 3.50 AZN, sonra hər km 0.40
    function calcFare(distanceKm){
      if (!isFinite(distanceKm) || distanceKm <= 0) return null;
      if (distanceKm <= 3) return 3.50;
      return 3.50 + (distanceKm - 3) * 0.40;
    }

    // =============================
    // Map init
    // =============================
    const gpsStatus = document.getElementById("gpsStatus");
    const destInput = document.getElementById("destination");
    const acList = document.getElementById("acList");
    const fareText = document.getElementById("fareText");
    const orderBtn = document.getElementById("orderBtn");
    const locBtn = document.getElementById("locBtn");

    const map = L.map('map', { zoomControl: true }).setView([40.4093, 49.8671], 13);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap'
    }).addTo(map);

    let myLatLng = null;
    let myMarker = null;

    let destLatLng = null;
    let destMarker = null;

    function setMyLocation(lat, lng){
      myLatLng = { lat, lng };
      if (!myMarker){
        myMarker = L.circleMarker([lat, lng], { radius: 7 }).addTo(map);
        myMarker.bindPopup("Siz buradasınız");
      } else {
        myMarker.setLatLng([lat, lng]);
      }
    }

    function setDestination(lat, lng, label){
      destLatLng = { lat, lng, label };
      if (!destMarker){
        destMarker = L.marker([lat, lng]).addTo(map);
      } else {
        destMarker.setLatLng([lat, lng]);
      }
      if (label) destMarker.bindPopup(label);

      // Fare update
      if (myLatLng){
        const km = haversineKm(myLatLng.lat, myLatLng.lng, lat, lng);
        const fare = calcFare(km);
        fareText.textContent = fare ? (fare.toFixed(2) + " AZN") : "—";
      } else {
        fareText.textContent = "—";
      }

      orderBtn.disabled = !(myLatLng && destLatLng);
    }

    // =============================
    // GPS
    // =============================
    function requestGPS(){
      if (!navigator.geolocation){
        gpsStatus.textContent = "GPS dəstəklənmir.";
        toast("GPS dəstəklənmir.");
        return;
      }

      gpsStatus.textContent = "GPS oxunur...";
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          const lat = pos.coords.latitude;
          const lng = pos.coords.longitude;
          setMyLocation(lat, lng);
          map.setView([lat, lng], 15);
          gpsStatus.textContent = "GPS hazırdır.";
          orderBtn.disabled = !(myLatLng && destLatLng);
        },
        (err) => {
          gpsStatus.textContent = "GPS icazəsi yoxdur.";
          toast("GPS icazəsi verilmədi. Telefon ayarlarından Location aç.");
        },
        { enableHighAccuracy: true, timeout: 12000, maximumAge: 0 }
      );

      // Live updates
      navigator.geolocation.watchPosition(
        (pos) => {
          const lat = pos.coords.latitude;
          const lng = pos.coords.longitude;
          setMyLocation(lat, lng);
          // fare update if destination selected
          if (destLatLng){
            const km = haversineKm(myLatLng.lat, myLatLng.lng, destLatLng.lat, destLatLng.lng);
            const fare = calcFare(km);
            fareText.textContent = fare ? (fare.toFixed(2) + " AZN") : "—";
          }
        },
        () => {},
        { enableHighAccuracy: true, maximumAge: 2000, timeout: 12000 }
      );
    }
    requestGPS();

    locBtn.addEventListener("click", () => {
      if (myLatLng) map.setView([myLatLng.lat, myLatLng.lng], 15);
      else toast("GPS hələ hazır deyil.");
    });

    // =============================
    // Autocomplete (Nominatim, AZ)
    // =============================
    let acData = []; // [{label, lat, lon}]
    let acTimer = null;

    function hideList(){
      acList.style.display = "none";
      acList.innerHTML = "";
    }

    function showList(items){
      if (!items || !items.length) { hideList(); return; }
      acList.innerHTML = items.map((it, idx) => (
        `<div class="acItem" data-idx="${idx}">${it.label}</div>`
      )).join("");
      acList.style.display = "block";
    }

    async function nominatimSearch(q){
      // Baku prioritetli axtarış (AZ), limit 6
      const url =
        "https://nominatim.openstreetmap.org/search?format=json&limit=6" +
        "&countrycodes=az&accept-language=az" +
        "&q=" + encodeURIComponent(q);

      const res = await fetch(url, {
        headers: { "Accept": "application/json" }
      });
      const json = await res.json();
      return (json || []).map(x => ({
        label: x.display_name,
        lat: parseFloat(x.lat),
        lon: parseFloat(x.lon)
      })).filter(x => isFinite(x.lat) && isFinite(x.lon));
    }

    destInput.addEventListener("input", () => {
      const q = destInput.value.trim();
      if (acTimer) clearTimeout(acTimer);

      if (q.length < 3){
        hideList();
        return;
      }

      acTimer = setTimeout(async () => {
        try{
          const items = await nominatimSearch(q);
          acData = items;
          showList(items);
        } catch(e){
          hideList();
        }
      }, 350);
    });

    // click select
    acList.addEventListener("click", (e) => {
      const item = e.target.closest(".acItem");
      if (!item) return;
      const idx = parseInt(item.getAttribute("data-idx"), 10);
      const sel = acData[idx];
      if (!sel) return;

      destInput.value = sel.label;
      hideList();

      setDestination(sel.lat, sel.lon, "Təyinat");
      map.setView([sel.lat, sel.lon], 14);
    });

    // hide on outside click
    document.addEventListener("click", (e) => {
      if (!e.target.closest(".acBox")) hideList();
    });

    // =============================
    // Order button (Demo action)
    // =============================
    orderBtn.addEventListener("click", async () => {
      if (!myLatLng) { toast("GPS hazır deyil."); return; }
      if (!destLatLng) { toast("Təyinat seçilməyib."); return; }

      const km = haversineKm(myLatLng.lat, myLatLng.lng, destLatLng.lat, destLatLng.lng);
      const fare = calcFare(km);

      // Burada backend-ə göndərə bilərik.
      // Hələlik demo: alert + console
      const payload = {
        pickup: myLatLng,
        dropoff: { lat: destLatLng.lat, lng: destLatLng.lng },
        dropoffLabel: destLatLng.label || destInput.value,
        distanceKm: km,
        fare
      };

      console.log("ORDER PAYLOAD:", payload);
      toast("Sifariş hazırlandı: " + (fare ? fare.toFixed(2) : "—") + " AZN");

      // Əgər səndə ride create endpoint varsa, buranı açarıq:
      // await fetch("/api/passenger/create_ride", {method:"POST", headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload)});
    });

    // Menu button placeholder
    document.getElementById("menuBtn").addEventListener("click", () => {
      toast("Menu (sonra əlavə edəcəyik)");
    });

  </script>
</body>
</html>
