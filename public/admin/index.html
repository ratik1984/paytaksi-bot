<!doctype html>
<html lang="az">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PayTaksi - Admin panel</title>
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial; margin:0; background:#150a1f; color:#f2e9ff;}
    header{padding:14px 16px; background:#231033; position:sticky; top:0;}
    h1{font-size:16px; margin:0;}
    .wrap{padding:14px 16px;}
    .card{background:#231033; border:1px solid rgba(255,255,255,.10); border-radius:14px; padding:12px; margin-bottom:12px;}
    input,button,select{width:100%; padding:10px 12px; border-radius:10px; border:1px solid rgba(255,255,255,.16); background:#150a1f; color:#f2e9ff; box-sizing:border-box;}
    button{background:#b63cff; border:none; font-weight:800;}
    button.secondary{background:#2e1644; border:1px solid rgba(255,255,255,.16);}
    .row{display:flex; gap:10px;}
    .row > *{flex:1;}
    .muted{color:#c9b7e9; font-size:12px;}
    table{width:100%; border-collapse:collapse; font-size:12px;}
    th,td{padding:8px; border-bottom:1px solid rgba(255,255,255,.10); text-align:left;}
    .pill{display:inline-block; padding:6px 10px; border-radius:999px; background:#2e1644; border:1px solid rgba(255,255,255,.12); font-size:12px;}
  </style>
</head>
<body>
  <header>
    <h1>🛠 PayTaksi — Admin panel</h1>
  </header>

  <div class="wrap">

    <div id="login" class="card">
      <div class="row">
        <input id="adminUser" placeholder="Admin user" />
        <input id="adminPass" type="password" placeholder="Admin pass" />
      </div>
      <div style="height:10px"></div>
      <button id="btnAdminLogin">Daxil ol</button>
      <div style="height:8px"></div>
      <div class="muted">Bu panel demo auth istifadə edir: request header ilə.</div>
    </div>

    <div id="app" style="display:none;">
      <div class="card">
        <div class="row" style="align-items:center;">
          <div class="pill">👑 Admin</div>
          <button id="btnLogout" class="secondary">Çıxış</button>
        </div>
        <div style="height:10px"></div>
        <div id="overview" class="muted"></div>
      </div>

      <div class="card">
        <div class="pill">💸 Pricing</div>
        <div style="height:10px"></div>
        <div class="row">
          <input id="baseFare" placeholder="Base fare" />
          <input id="includedKm" placeholder="Included km" />
        </div>
        <div style="height:10px"></div>
        <div class="row">
          <input id="perKm" placeholder="Per km" />
          <input id="commissionRate" placeholder="Commission (0.10)" />
        </div>
        <div style="height:10px"></div>
        <button id="btnSavePricing" class="secondary">Yadda saxla</button>
      </div>

      <div class="card">
        <div class="pill">👥 Drivers</div>
        <div style="height:10px"></div>
        <div id="drivers"></div>
      </div>

      <div class="card">
        <div class="pill">🧾 Trips</div>
        <div style="height:10px"></div>
        <div id="trips"></div>
      </div>

    </div>

  </div>

  <script>
    const ls = (k,v)=> v===undefined?localStorage.getItem(k):localStorage.setItem(k,v);
    const API = (p) => `${location.origin}${p}`;

    let adminUser = ls('pt_admin_user') || '';
    let adminPass = ls('pt_admin_pass') || '';

    const $ = (id)=>document.getElementById(id);

    $('adminUser').value = adminUser;
    $('adminPass').value = adminPass;

    function showLogin(){ $('login').style.display='block'; $('app').style.display='none'; }
    function showApp(){ $('login').style.display='none'; $('app').style.display='block'; }

    async function get(url){
      const r = await fetch(API(url), {headers:{'X-Admin-User':adminUser,'X-Admin-Pass':adminPass}});
      const j = await r.json().catch(()=>({}));
      if(!r.ok) throw new Error(j.error||'Xəta');
      return j;
    }
    async function post(url, body){
      const r = await fetch(API(url), {method:'POST', headers:{'Content-Type':'application/json','X-Admin-User':adminUser,'X-Admin-Pass':adminPass}, body: JSON.stringify(body||{})});
      const j = await r.json().catch(()=>({}));
      if(!r.ok) throw new Error(j.error||'Xəta');
      return j;
    }

    $('btnAdminLogin').onclick = async ()=>{
      adminUser = $('adminUser').value.trim();
      adminPass = $('adminPass').value;
      ls('pt_admin_user', adminUser);
      ls('pt_admin_pass', adminPass);
      try{
        await refreshAll();
        showApp();
      }catch(e){ alert(e.message); }
    };

    $('btnLogout').onclick = ()=>{ adminUser=''; adminPass=''; ls('pt_admin_user',''); ls('pt_admin_pass',''); showLogin(); };

    async function refreshAll(){
      const o = await get('/api/admin/overview');
      $('overview').innerHTML = `Drivers: ${o.drivers.c} (approved: ${o.drivers.approved})<br>Trips: ${o.trips.c} (completed: ${o.trips.completed})`;

      $('baseFare').value = o.pricing.baseFare;
      $('includedKm').value = o.pricing.includedKm;
      $('perKm').value = o.pricing.perKm;
      $('commissionRate').value = o.pricing.commissionRate;

      const d = await get('/api/admin/drivers');
      renderDrivers(d.drivers);

      const t = await get('/api/admin/trips');
      renderTrips(t.trips);
    }

    function renderDrivers(list){
      const rows = list.map(x=>{
        const approved = x.is_approved ? '✅' : '⏳';
        return `<tr>
          <td>${x.id}</td>
          <td>${x.first_name} ${x.last_name}<br><span class="muted">${x.phone}</span></td>
          <td>${x.brand||''} ${x.model||''} ${x.year||''}<br><span class="muted">${x.plate_number||''}</span></td>
          <td>${approved}</td>
          <td>
            <button class="secondary" data-a="approve" data-id="${x.id}">Approve</button>
            <div style="height:6px"></div>
            <button class="secondary" data-a="reject" data-id="${x.id}">Reject</button>
          </td>
        </tr>`;
      }).join('');

      $('drivers').innerHTML = `<table>
        <thead><tr><th>ID</th><th>Sürücü</th><th>Maşın</th><th>Status</th><th>Action</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>`;

      $('drivers').querySelectorAll('button[data-a]').forEach(btn=>{
        btn.onclick = async ()=>{
          const id = btn.getAttribute('data-id');
          const a = btn.getAttribute('data-a');
          try{
            await post(`/api/admin/driver/${id}/${a}`, {});
            await refreshAll();
          }catch(e){ alert(e.message); }
        };
      });
    }

    function renderTrips(list){
      const rows = list.map(x=>{
        return `<tr>
          <td>#${x.id}</td>
          <td>${x.p_first} ${x.p_last}</td>
          <td>${x.d_first? (x.d_first+' '+x.d_last):'-'}</td>
          <td>${x.status}</td>
          <td>${Number(x.distance_km||0).toFixed(2)} km</td>
          <td>${x.fare||''} AZN</td>
          <td>${new Date(x.created_at).toLocaleString()}</td>
        </tr>`;
      }).join('');

      $('trips').innerHTML = `<table>
        <thead><tr><th>Trip</th><th>Passenger</th><th>Driver</th><th>Status</th><th>KM</th><th>Fare</th><th>Time</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>`;
    }

    $('btnSavePricing').onclick = async ()=>{
      try{
        await post('/api/admin/pricing', {
          baseFare: $('baseFare').value,
          includedKm: $('includedKm').value,
          perKm: $('perKm').value,
          commissionRate: $('commissionRate').value
        });
        alert('✅ Yadda saxlanıldı');
        await refreshAll();
      }catch(e){ alert(e.message); }
    };

    // Auto login if stored
    if(adminUser && adminPass){
      refreshAll().then(()=>showApp()).catch(()=>showLogin());
    } else {
      showLogin();
    }
  </script>
</body>
</html>
