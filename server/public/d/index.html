<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PayTaksi — Sürücü</title>
  <link rel="stylesheet" href="/shared/app.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="/socket.io/socket.io.js"></script>
</head>
<body>
  <div class="header">🚗 PayTaksi <span class="badge">Driver</span></div>
  <div class="container" style="padding-bottom:110px;">
    <div class="card">
      <div id="map"></div>
      <div class="row" style="justify-content:space-between;margin-top:10px;">
        <button id="onlineBtn" class="btn green" style="flex:1;">Onlayn ol</button>
        <button id="navBtn" class="btn gray">Waze</button>
      </div>
      <div class="small" id="locStatus" style="margin-top:8px;"></div>
    </div>

    <div class="card" id="offerCard" style="display:none;">
      <div style="font-weight:900;font-size:18px;">Yeni sifariş</div>
      <div class="small" id="offerText" style="margin-top:6px;white-space:pre-wrap;"></div>
      <div class="row" style="margin-top:10px;">
        <button class="btn green" id="acceptBtn" style="flex:1;">Qəbul et</button>
        <button class="btn red" id="rejectBtn" style="flex:1;">Rədd et</button>
      </div>
      <div class="small" style="margin-top:8px;">Qeyd: Telegram bot mesajındakı “Qəbul et” düyməsi də işləyir.</div>
    </div>

    <div class="card" id="tripCard" style="display:none;">
      <div class="row" style="justify-content:space-between;">
        <div>
          <div style="font-weight:900;">Gediş</div>
          <div class="small" id="tripMeta"></div>
        </div>
        <div style="text-align:right;">
          <div style="font-weight:900;font-size:22px;" id="tripFare">0.00 AZN</div>
          <div class="small" id="tripEarn">Qazanc: 0.00</div>
        </div>
      </div>
      <div class="row" style="margin-top:10px;flex-wrap:wrap;">
        <button class="btn gray" id="arriveBtn" style="flex:1;">Çatdım</button>
        <button class="btn green" id="startBtn" style="flex:1;">Gedişə başla</button>
        <button class="btn red" id="endBtn" style="flex:1;">Gedişi bitir</button>
      </div>
    </div>

    <div class="card" id="finalCard" style="display:none;">
      <div class="small">Yekun məbləğ</div>
      <div class="bigFare" id="finalFare">0.00 AZN</div>
      <div class="small" id="finalDetail"></div>
      <div style="margin-top:10px;">
        <button class="btn green" onclick="location.reload()" style="width:100%;">Yeni sifariş gözlə</button>
      </div>
    </div>
  </div>

  <div class="footerBar">
    <div class="footerCard">
      <div class="small">Status</div>
      <div id="status" style="font-weight:800;">Hazır</div>
    </div>
  </div>

  <script src="/shared/app.js"></script>
  <script>
    const tgId = getTgId();
    const statusEl = document.getElementById('status');
    const locStatus = document.getElementById('locStatus');

    let map, meMarker;
    let isOnline = false;
    let lastPos = null;

    let currentOffer = null;
    let currentRide = null;

    function initMap(lat, lng) {
      map = L.map('map').setView([lat, lng], 13);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; OpenStreetMap'
      }).addTo(map);
      meMarker = L.marker([lat, lng]).addTo(map).bindPopup('Siz');
    }

    const socket = connectSocket();
    socket.emit('join', { role: 'driver', tg_id: tgId });
    socket.on('ride_offer', (o) => {
      currentOffer = o;
      document.getElementById('offerCard').style.display = 'block';
      document.getElementById('offerText').textContent = `📍 ${o.pickup.text || 'Pickup'}\n🏁 ${o.dropoff.text || 'Dropoff'}\n💰 ${money(o.fare.total_fare)} AZN`;
      setStatus(statusEl, 'Yeni sifariş gəldi');
    });

    async function sendLocation(pos) {
      if (!tgId) return;
      lastPos = { lat: pos.coords.latitude, lng: pos.coords.longitude };
      if (meMarker) meMarker.setLatLng([lastPos.lat, lastPos.lng]);
      if (map) map.setView([lastPos.lat, lastPos.lng], map.getZoom());

      if (isOnline) {
        await apiPost('/api/driver/location', { driver_tg_id: tgId, lat: lastPos.lat, lng: lastPos.lng, heading: pos.coords.heading || 0, speed: pos.coords.speed || 0 });
        locStatus.textContent = '📡 Canlı yerləşmə göndərilir';
      } else {
        locStatus.textContent = 'Offline';
      }
    }

    async function setOnline(v) {
      isOnline = v;
      document.getElementById('onlineBtn').textContent = isOnline ? 'Oflayn ol' : 'Onlayn ol';
      document.getElementById('onlineBtn').className = 'btn ' + (isOnline ? 'red' : 'green');
      await apiPost('/api/driver/online', { driver_tg_id: tgId, is_online: isOnline });
      setStatus(statusEl, isOnline ? 'Onlayn' : 'Oflayn');
    }

    document.getElementById('onlineBtn').onclick = () => setOnline(!isOnline);

    document.getElementById('navBtn').onclick = () => {
      if (!lastPos) return;
      const url = `waze://?ll=${lastPos.lat},${lastPos.lng}&navigate=yes`;
      window.location.href = url;
    };

    document.getElementById('acceptBtn').onclick = async () => {
      if (!currentOffer) return;
      await apiPost(`/api/ride/${currentOffer.ride_id}/driver_action`, { driver_tg_id: tgId, action: 'accept' });
      document.getElementById('offerCard').style.display = 'none';
      document.getElementById('tripCard').style.display = 'block';
      currentRide = currentOffer;
      document.getElementById('tripMeta').textContent = `${currentOffer.pickup.text || ''} → ${currentOffer.dropoff.text || ''}`;
      document.getElementById('tripFare').textContent = money(currentOffer.fare.total_fare) + ' AZN';
      document.getElementById('tripEarn').textContent = 'Qazanc: ' + money(currentOffer.fare.driver_earnings);
      setStatus(statusEl, 'Qəbul edildi');
    };

    document.getElementById('rejectBtn').onclick = async () => {
      if (!currentOffer) return;
      await apiPost(`/api/ride/${currentOffer.ride_id}/driver_action`, { driver_tg_id: tgId, action: 'reject' });
      currentOffer = null;
      document.getElementById('offerCard').style.display = 'none';
      setStatus(statusEl, 'Rədd edildi');
    };

    document.getElementById('arriveBtn').onclick = async () => {
      if (!currentRide) return;
      await apiPost(`/api/ride/${currentRide.ride_id}/driver_action`, { driver_tg_id: tgId, action: 'arrive' });
      setStatus(statusEl, 'Pickup-a çatdı');
    };

    document.getElementById('startBtn').onclick = async () => {
      if (!currentRide) return;
      await apiPost(`/api/ride/${currentRide.ride_id}/driver_action`, { driver_tg_id: tgId, action: 'start' });
      setStatus(statusEl, 'Gediş başladı');
    };

    document.getElementById('endBtn').onclick = async () => {
      if (!currentRide) return;
      await apiPost(`/api/ride/${currentRide.ride_id}/driver_action`, { driver_tg_id: tgId, action: 'end' });
      document.getElementById('tripCard').style.display = 'none';
      document.getElementById('finalCard').style.display = 'block';
      document.getElementById('finalFare').textContent = money(currentRide.fare.total_fare) + ' AZN';
      document.getElementById('finalDetail').textContent = `Komissiya: ${money(currentRide.fare.commission_amount)} • Qazanc: ${money(currentRide.fare.driver_earnings)}`;
      setStatus(statusEl, 'Gediş bitdi');
    };

    navigator.geolocation.watchPosition(
      (pos) => {
        if (!map) initMap(pos.coords.latitude, pos.coords.longitude);
        sendLocation(pos).catch(() => {});
      },
      () => {
        if (!map) initMap(40.4093, 49.8671);
      },
      { enableHighAccuracy: true, maximumAge: 5000, timeout: 15000 }
    );
  </script>
</body>
</html>
